[project]
name = "openlending"
version = "0.1.0"
description = "A reproducible pipeline that harmonises US mortgage-lending public data (HMDA, FDIC, CFPB complaints) into documented, validated Parquet."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Linus Dominic Nathaniel" }]
keywords = ["hmda", "mortgage", "fair-lending", "open-data", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "duckdb>=1.3",
    "httpx>=0.27",
]

[project.scripts]
openlending = "openlending.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlending"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
]
# reconkit is used by `openlending validate` for the raw-vs-harmonised reconciliation. It is
# not on PyPI, so it is installed from its git repository.
recon = [
    "reconkit[duckdb] @ git+https://github.com/linusdominic/reconkit",
]

[tool.uv]
default-groups = ["dev", "recon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S"]
ignore = [
    "S608", # SQL is assembled from fixed column specs and validated identifiers, not user input
    "S101", # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501", "PT018"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/openlending", "tests"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "reconkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["data: needs the full build under data/ (skipped when it is absent)"]
